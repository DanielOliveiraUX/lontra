{% assign s = site.data.site %}{% assign home = '/' | relative_url %}
  <a class="skip-link" href="#main">Ir para o conteúdo principal</a>
  <header class="site-header{% if page.fixed_header %} is-fixed{% endif %}">
    <a class="site-header__logo" href="{{ home }}">{{ s.header.logo }}</a>
    <nav class="site-nav" aria-label="Site">
      <a href="{{ home }}#about" data-nav="about"><span>ABOUT</span></a>
      <a href="{{ '/projects/' | relative_url }}" data-nav="work"{% if page.active == 'work' %} class="is-active" aria-current="page"{% endif %}><span>WORK</span></a>
      <a href="{{ home }}#services" data-nav="services"><span>CREATIVE SERVICES</span></a>
    </nav>
    <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu"></button>
  </header>
  <div class="mobile-menu" id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu">
    <a class="mobile-menu__title" href="{{ home }}"><span class="serif">{{ s.footer.brand_italic }}</span> {{ s.footer.brand_line1 }} {{ s.footer.brand_line2 }}</a>
    <button class="mobile-menu__close" type="button" aria-label="Close"></button>
    <nav aria-label="Site">
      <a href="{{ home }}#about">ABOUT</a>
      <a href="{{ '/projects/' | relative_url }}">WORK</a>
      <a href="{{ home }}#services">CREATIVE SERVICES</a>
    </nav>
  </div>
