media:
  input: assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image, video]

content:
  - name: projetos
    label: Projetos da Home
    description: Os projetos que aparecem na página inicial. Cada um tem o bloco da Home e o artigo que abre no "leia mais".
    type: collection
    path: _projetos
    view:
      primary: titulo
      fields: [titulo, categoria, ordem, publicado]
      default:
        sort: ordem
        order: asc
    fields:
      - name: publicado
        label: Mostrar no site
        description: Desligue para esconder o projeto sem apagá-lo.
        type: boolean
        default: true
      - name: ordem
        label: Posição na Home
        description: "1 aparece primeiro, depois 2, 3..."
        type: number
        required: true
      - name: categoria
        label: Categoria
        description: "A etiqueta branca acima do título. Ex.: #advertising, #film, #music"
        type: string
      - name: titulo
        label: Título na Home
        type: string
        required: true
      - name: resumo
        label: Frase de chamada na Home
        description: Uma ou duas linhas abaixo do título.
        type: text
      - name: fundo
        label: Imagem de fundo na Home
        description: Foto horizontal grande (ideal 2400 × 940 px).
        type: image
        required: true
      - name: artigo
        label: Artigo (abre no "leia mais")
        description: Deixe sem blocos para esconder o botão "leia mais".
        type: object
        fields:
          - name: titulo
            label: Título do artigo
            type: string
          - name: subtitulo
            label: Subtítulo do artigo
            type: string
          - name: blocos
            label: Conteúdo do artigo
            description: Monte o artigo empilhando blocos. Use as setas para mudar a ordem.
            type: block
            list: true
            blockKey: tipo
            blocks:
              - name: texto
                label: Texto
                fields:
                  - name: texto
                    label: Texto
                    type: rich-text
              - name: midia
                label: Foto ou vídeo grande
                fields:
                  - name: midia
                    label: Foto ou vídeo
                    description: "Envie uma foto (jpg/png) ou um vídeo mp4 horizontal."
                    type: file
                  - name: capa
                    label: Capa do vídeo (opcional)
                    description: Imagem mostrada antes de dar play.
                    type: image
                  - name: automatico
                    label: Vídeo toca sozinho, sem som e em repetição
                    type: boolean
                    default: false
              - name: texto-midia
                label: Texto ao lado de foto ou vídeo
                fields:
                  - name: texto
                    label: Texto
                    type: rich-text
                  - name: midia
                    label: Foto ou vídeo
                    type: file
                  - name: capa
                    label: Capa do vídeo (opcional)
                    type: image
                  - name: formato
                    label: Formato da foto ou vídeo
                    type: select
                    default: foto
                    options:
                      values:
                        - value: foto
                          label: Foto (retangular, um pouco mais alta)
                        - value: video
                          label: Vídeo horizontal (16:9)
                        - value: vertical
                          label: Vertical (celular, 9:16)
                  - name: lado
                    label: Lado da foto ou vídeo
                    type: select
                    default: esquerda
                    options:
                      values:
                        - value: esquerda
                          label: Esquerda
                        - value: direita
                          label: Direita
                  - name: automatico
                    label: Vídeo toca sozinho, sem som e em repetição
                    type: boolean
                    default: false
              - name: duas-verticais
                label: Dois vídeos verticais lado a lado
                fields:
                  - name: midia1
                    label: Vídeo da esquerda
                    type: file
                  - name: capa1
                    label: Capa do vídeo da esquerda (opcional)
                    type: image
                  - name: midia2
                    label: Vídeo da direita
                    type: file
                  - name: capa2
                    label: Capa do vídeo da direita (opcional)
                    type: image
                  - name: automatico
                    label: Vídeos tocam sozinhos, sem som e em repetição
                    type: boolean
                    default: false
              - name: logos
                label: Logos ou selos
                fields:
                  - name: imagens
                    label: Imagens
                    description: "PNG com fundo transparente, até 130 px de altura."
                    type: image
                    list: true
              - name: premios
                label: Prêmios (com louros)
                fields:
                  - name: premios
                    label: Prêmios
                    type: object
                    list: true
                    fields:
                      - name: premio
                        label: Prêmio
                        description: "Ex.: Best Director"
                        type: string
                      - name: festival
                        label: Festival
                        description: "Ex.: Paris Film Festival"
                        type: string

  - name: trabalhos
    label: Trabalhos do Portfolio
    description: A lista de trabalhos da página Portfolio, cada um com seu vídeo.
    type: collection
    path: _trabalhos
    view:
      primary: cliente
      fields: [cliente, projeto, ordem, publicado]
      default:
        sort: ordem
        order: asc
    fields:
      - name: publicado
        label: Mostrar no site
        description: Desligue para esconder o trabalho sem apagá-lo.
        type: boolean
        default: true
      - name: ordem
        label: Posição na lista
        description: "1 aparece primeiro, depois 2, 3..."
        type: number
        required: true
      - name: cliente
        label: Cliente
        description: "Ex.: LG"
        type: string
        required: true
      - name: projeto
        label: Projeto
        description: "Ex.: Refrigeradores"
        type: string
      - name: menu
        label: Nome no menu lateral (opcional)
        description: Se ficar vazio, usa o nome do cliente.
        type: string
      - name: video
        label: Vídeo
        description: "mp4 horizontal (16:9). Toca sozinho, sem som, quando aparece na tela."
        type: file
        required: true
      - name: capa
        label: Capa do vídeo (opcional)
        description: Imagem mostrada enquanto o vídeo carrega.
        type: image
      - name: hashtags
        label: Hashtags
        description: "Até 3. Ex.: #jingle"
        type: string
        list:
          max: 3
      - name: fonte
        label: Fonte do título
        type: select
        default: mono
        options:
          values:
            - value: mono
              label: Mono (padrão)
            - value: arredondada
              label: Arredondada
