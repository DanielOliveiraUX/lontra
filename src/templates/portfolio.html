<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | Lake</title>
  <meta name="description" content="Portfolio da Lake — trabalhos de trilha, sound design e jingles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono&family=Quicksand:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css?v={{v}}">
<!--@HEAD-->
</head>
<body class="page-portfolio">
  <main id="main">

    <!-- Topo -->
    <section class="sec phero" id="topo">
      <div class="fixed-bg" aria-hidden="true">
        <video autoplay muted loop playsinline poster="{{m:m1}}">
          <source src="{{m:m2}}" type="video/mp4">
        </video>
      </div>
      <div class="marquee" aria-hidden="true">
        <div class="marquee__track"><span>#storytelling&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#sounddesign&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#foley&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#soundtrack&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#voiceover&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#jingles&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#advertising&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#film&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span>#storytelling&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#sounddesign&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#foley&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#soundtrack&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#voiceover&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#jingles&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#advertising&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;#film&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span></div>
      </div>
      <img class="phero__flower" src="{{m:m19}}" alt="" aria-hidden="true">
      <div class="grid">
        <h1 class="phero__logo"><a href="/"><img src="{{m:m20}}" alt="Lake — voltar à home"></a></h1>
      </div>
    </section>

    <!-- Trabalhos publicados -->
<!--@TRABALHOS-->

    <section class="sec pback">
      <a class="pback__btn" href="/" data-edit="textos.voltar_home">{{t:voltar_home}}</a>
    </section>

    <!-- faixa final -->
    <section class="sec strip" aria-hidden="true">
      <div class="fixed-bg">
        <video autoplay muted loop playsinline poster="{{m:m1}}">
          <source src="{{m:m2}}" type="video/mp4">
        </video>
      </div>
      <div class="wave wave--top"></div>
      <img class="strip__flower" src="{{m:m18}}" alt="">
    </section>
  </main>

  <nav class="pnav" aria-label="Trabalhos">
<!--@MENU-->
  </nav>

  <script src="/assets/js/main.js?v={{v}}" defer></script>
<!--@EDITOR-->
</body>
</html>
